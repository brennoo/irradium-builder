name: Sync Upstream Port Submodules

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to latest upstream ${{ github.ref_name }} commits
        run: |
          git submodule update --remote --merge
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(ports): sync upstream Irradium and CRUX ${{ github.ref_name }} submodules"
            git push
          else
            echo "Submodules are already up to date."
          fi
